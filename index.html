<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graduation Project Forms</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card-link {
      display: block;
      padding: 1rem 1.25rem;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .card-link:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }
    .card-link.secondary {
      background-color: #334155;
    }
    .card-link.secondary:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Graduation Project Forms</h1>
    <p>Select a form below to open and edit:</p>
    <div class="links-list">
      <a class="card-link" href="GP-Form-03.html">Open GP-Form-03 (Proposal)</a>
      <a class="card-link secondary" href="GP-Form-02.html">Open GP-Form-02</a>
    </div>
  </div>
</body>
</html>
